services:
  postgres:
    image: postgres:16
    container_name: taskapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - taskapp-postgres-data:/var/lib/postgresql/data

volumes:
  taskapp-postgres-data: